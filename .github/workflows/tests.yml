name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate CBIC HSN master data
        run: python scripts/validate_cbic.py

      - name: Run test suite
        env:
          APP_ENV: development
        run: pytest -m "not integration" -q
