name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live Postgres integration tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: development
        run: pytest -m integration -v

      - name: Classify layer smoke test (Neon Postgres)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_ENV: development
          SECRET_KEY: ci-smoke-test-secret-key-32chars-min
          API_KEY: ci-api-key
          ADMIN_API_KEY: ci-admin-api-key
        run: python scripts/layer_smoke_test.py --assert-ci
